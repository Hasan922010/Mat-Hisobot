x-app-env: &app-env
  DEBUG: "${DEBUG:-False}"
  SECRET_KEY: "${SECRET_KEY:-replace-me-with-50-plus-random-chars-before-production-deploy-2026}"
  ALLOWED_HOSTS: "${ALLOWED_HOSTS:-localhost,127.0.0.1}"
  CSRF_TRUSTED_ORIGINS: "${CSRF_TRUSTED_ORIGINS:-}"
  SECURE_SSL_REDIRECT: "${SECURE_SSL_REDIRECT:-False}"
  DB_NAME: "${DB_NAME:-mat_hisobot}"
  DB_USER: "${DB_USER:-postgres}"
  DB_PASSWORD: "${DB_PASSWORD:-mat_hisobot_pass}"
  DB_HOST: "db"
  DB_PORT: "5432"
  GEMINI_API_KEY: "${GEMINI_API_KEY:-}"

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: "${DB_NAME:-mat_hisobot}"
      POSTGRES_USER: "${DB_USER:-postgres}"
      POSTGRES_PASSWORD: "${DB_PASSWORD:-mat_hisobot_pass}"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  web:
    build: .
    image: mat-hisobot:latest
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      <<: *app-env
      RUN_MIGRATIONS: "1"
      DJANGO_SUPERUSER_USERNAME: "${DJANGO_SUPERUSER_USERNAME:-}"
      DJANGO_SUPERUSER_PASSWORD: "${DJANGO_SUPERUSER_PASSWORD:-}"
      DJANGO_SUPERUSER_EMAIL: "${DJANGO_SUPERUSER_EMAIL:-}"
    ports:
      - "${APP_PORT:-8000}:8000"
    volumes:
      - media_data:/app/media
    healthcheck:
      test: ["CMD", "python", "-c", "import socket; s=socket.create_connection(('127.0.0.1', 8000), 2); s.close()"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s

  worker:
    build: .
    image: mat-hisobot:latest
    restart: unless-stopped
    depends_on:
      web:
        condition: service_healthy
    environment:
      <<: *app-env
      RUN_MIGRATIONS: "0"
    volumes:
      - media_data:/app/media
    command: ["python", "manage.py", "qcluster"]

volumes:
  pgdata:
  media_data:
