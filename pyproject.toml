[project]
name = "mat-hisobot"
version = "0.1.0"
description = "Add your description here"
authors = [
    { name = "Hasanali", email = "Hasan922010@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "django>=6.1.3",
    "django-q2>=1.11.1",
    "djangorestframework>=3.18.3",
    "google-genai>=3.5.0",
    "gunicorn>=27.0.1",
    "openpyxl>=3.1.5",
    "pandas>=3.1.1",
    "psycopg[binary]>=3.3.9",
    "pytest>=9.2.0",
    "pytest-django>=4.14.0",
    "python-dotenv>=1.2.4",
    "rapidfuzz>=3.14.6",
    "whitenoise>=6.12.0",
    "xlrd>=2.0.2",
]

[project.scripts]
mat-hisobot = "mat_hisobot:main"

[build-system]
requires = ["uv_build>=0.13.9,<0.14.0"]
build-backend = "uv_build"
